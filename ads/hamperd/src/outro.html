<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face{
    font-family:'Archivo Black';
    src:url('fonts/archivo-black.woff2') format('woff2');
    font-weight:400;
  }
  @font-face{
    font-family:'Inter';
    src:url('fonts/inter-latin.woff2') format('woff2');
    font-weight:100 900;
  }
  :root{
    --navy:#1E2A38; --navy-deep:#16202B; --navy-raise:#243447;
    --powder:#E6F0FA; --powder-dim:rgba(230,240,250,.72);
    --sky:#7FBFE9; --sky-faint:rgba(127,191,233,.16); --sky-line:rgba(127,191,233,.32);
    --lemon:#FFD24D;
    --display:'Archivo Black','Arial Black',sans-serif;
    --body:'Inter','Helvetica Neue',Arial,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,'Courier New',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--navy)}
  #stage{
    position:relative;width:1080px;height:1920px;overflow:hidden;
    background:
      radial-gradient(1400px 900px at 50% 12%, var(--navy-raise) 0%, transparent 62%),
      radial-gradient(1200px 800px at 50% 108%, var(--navy-deep) 0%, transparent 55%),
      var(--navy);
  }
  #vignette{
    position:absolute;inset:0;z-index:40;pointer-events:none;
    background:radial-gradient(1500px 2100px at 50% 46%, transparent 62%, rgba(22,32,43,.55) 100%);
  }
  .beat{position:absolute;inset:0;opacity:0}
  .col{
    position:absolute;left:0;right:0;top:0;bottom:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:230px 84px 430px;
  }
  .kicker{
    font-family:var(--mono);font-size:30px;letter-spacing:.26em;
    color:var(--sky);text-transform:uppercase;
    display:flex;align-items:center;gap:22px;
  }
  .kicker::before,.kicker::after{
    content:"";display:block;width:56px;height:2px;background:var(--sky-line);
  }
  .headline{
    font-family:var(--display);font-weight:400;color:var(--powder);
    font-size:110px;line-height:1.04;letter-spacing:-.01em;text-align:center;
    margin-top:40px;
  }
  .endword{
    font-family:var(--display);color:var(--powder);
    font-size:66px;letter-spacing:.30em;text-indent:.30em;text-align:center;
  }
  .endrule{width:120px;height:3px;background:var(--sky-line);margin:44px auto 0}
  .endline{
    font-family:var(--display);color:var(--powder);text-align:center;
    font-size:100px;line-height:1.06;letter-spacing:-.01em;margin-top:46px;
  }
  .endsub{
    font-family:var(--body);font-weight:600;color:var(--sky);
    font-size:52px;text-align:center;margin-top:34px;letter-spacing:.01em;
  }
  .pill{
    margin-top:74px;
    font-family:var(--body);font-weight:700;font-size:46px;letter-spacing:.02em;
    color:var(--navy-deep);background:var(--lemon);
    padding:34px 76px;border-radius:999px;
  }
  .endfoot{
    margin-top:60px;font-family:var(--mono);font-size:29px;
    letter-spacing:.24em;color:var(--powder-dim);text-transform:uppercase;
  }
</style>
</head>
<body>
<div id="stage">

  <!-- A · the verdict -->
  <section class="beat" id="a1">
    <div class="col">
      <div class="kicker" data-el="k">the fitted sheet</div>
      <div class="headline" data-el="h">It wins.<br>Every time.</div>
    </div>
  </section>

  <!-- B · end card -->
  <section class="beat" id="a2">
    <div class="col">
      <div class="endword" data-el="w">HAMPER'D</div>
      <div class="endrule" data-el="r"></div>
      <div class="endline" data-el="h">Let Hamper'd<br>take care of<br>this mess.</div>
      <div class="endsub" data-el="s">So you don't have to.</div>
      <div class="pill" data-el="c">hamperd.com</div>
      <div class="endfoot" data-el="f">wash · fold · delivered · raleigh</div>
    </div>
  </section>

  <div id="vignette"></div>
</div>

<script>
const FPS = 30;
const TOTAL = 7.00;
const SPLIT = 2.40;

const $ = (sel,root)=> (root||document).querySelector(sel);
const clamp01 = x => Math.max(0, Math.min(1, x));
const eoc = x => 1 - Math.pow(1-x, 3);
const eob = x => { const c1=1.30, c3=c1+1;
  return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
function ent(u, delay, dur){ return eoc(clamp01((u-delay)/(dur||0.45))); }
function exf(u, beatDur, dur){ return clamp01((beatDur-u)/(dur||0.30)); }
function styleIn(el, p, rise){
  el.style.opacity = p;
  el.style.transform = 'translateY(' + ((1-p)*(rise==null?44:rise)) + 'px)';
}

function seek(t){
  t = Math.max(0, Math.min(TOTAL - 1/FPS, t));
  const a1 = document.getElementById('a1'), a2 = document.getElementById('a2');

  if(t < SPLIT){
    a1.style.opacity = 1; a2.style.opacity = 0;
    const u = t, X = exf(u, SPLIT);
    styleIn($('[data-el=k]',a1), ent(u,0.00)*X);
    styleIn($('[data-el=h]',a1), ent(u,0.14)*X);
  } else {
    a1.style.opacity = 0; a2.style.opacity = 1;
    const u = t - SPLIT;
    const w=$('[data-el=w]',a2), r=$('[data-el=r]',a2), h=$('[data-el=h]',a2),
          s=$('[data-el=s]',a2), c=$('[data-el=c]',a2), f=$('[data-el=f]',a2);
    styleIn(w, ent(u,0.00));
    r.style.opacity = ent(u,0.10);
    const hp = clamp01((u-0.18)/0.6);
    h.style.opacity = eoc(hp);
    h.style.transform = 'scale(' + (0.92 + 0.08*eob(hp)) + ')';
    styleIn(s, ent(u,0.62));
    const cp2 = ent(u,0.88,0.5);
    const pulse = 0.25 + 0.15*Math.sin(2*Math.PI*(u/1.6));
    c.style.opacity = cp2;
    c.style.transform = 'translateY('+((1-cp2)*40)+'px)';
    c.style.boxShadow = '0 24px 70px rgba(255,210,77,'+(pulse*cp2)+')';
    styleIn(f, ent(u,1.10));
  }
}

window.TOTAL = TOTAL; window.FPS = FPS; window.seek = seek;
window.READY = false;
document.fonts.ready.then(()=>{ seek(0); window.READY = true; });
</script>
</body>
</html>
